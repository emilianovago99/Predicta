# Docker Compose >= 2.24.4. Base aislada, sin servicios externos.
services:
  mariadb:
    ports: !override ["127.0.0.1:13307:3306"]
  api:
    image: predicta-validation-api
    volumes:
      - ./tests:/tests:ro
    ports: !override ["127.0.0.1:18000:8000"]
    environment:
      GEMINI_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      TELEGRAM_DELIVERY_ENABLED: "false"
  web:
    image: predicta-validation-web
    ports: !override ["127.0.0.1:18080:80"]
