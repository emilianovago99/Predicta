<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Predicta: monitoreo y mantenimiento predictivo industrial.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Predicta">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Predicta</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Remove old Flutter workers/caches before loading the current authenticated client.
    // Old workers can otherwise serve JavaScript from before JWT was introduced.
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const scope = new URL('.', document.baseURI).href;
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.filter(r => r.scope === scope).map(r => r.unregister()));
        }
        if ('caches' in window) {
          await Promise.all(['flutter-app-cache', 'flutter-temp-cache', 'flutter-app-manifest']
            .map(name => caches.delete(name)));
        }
      } catch (error) {
        console.warn('No se pudo limpiar la caché anterior de Flutter.', error);
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?release=' + Date.now();
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
