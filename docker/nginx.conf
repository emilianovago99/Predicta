map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
    listen 80;
    server_name _;
    server_tokens off;
    # Refresh Docker DNS when Compose replaces the API container on an update.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    location = /api/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location /api/ {
        proxy_pass http://$api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 90s;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
